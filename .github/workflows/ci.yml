name: Moodle Plugin CI

on:
  pull_request:
    branches:
      - main
      - 'MOODLE_*_STABLE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-plugin-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Build test matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - id: build
        shell: bash
        run: |
          set -euo pipefail

          # PHP versions each Moodle version supports. This is a fact about Moodle, so add a row
          # here before adding a version to $plugin->supported in version.php.
          # https://moodledev.io/general/development/policies/php
          MOODLE_PHP_TABLE='{
            "405": ["8.1", "8.2", "8.3"],
            "500": ["8.2", "8.3", "8.4"],
            "501": ["8.2", "8.3", "8.4"],
            "502": ["8.3", "8.4"],
            "503": ["8.3", "8.4"]
          }'

          # Database images for each Moodle version. Moodle 5.3 requires PostgreSQL 17 and MariaDB 11.4.
          MOODLE_DB_TABLE='{
            "405": {"postgres": "16", "mariadb": "10"},
            "500": {"postgres": "16", "mariadb": "10"},
            "501": {"postgres": "16", "mariadb": "10"},
            "502": {"postgres": "16", "mariadb": "10"},
            "503": {"postgres": "17", "mariadb": "11.4"}
          }'

          # Both ends of $plugin->supported are always tested. These are the versions in between
          # that are tested as well; each must fall strictly inside the supported range.
          MOODLE_EXTRA_VERSIONS='["502"]'

          supported=$(grep -oP '\$plugin->supported\s*=\s*\[\K[^\]]+' version.php || true)
          if [ -z "$supported" ]; then
            echo "::error::Could not find \$plugin->supported = [...] in version.php."
            exit 1
          fi
          ends=$(echo "$supported" | tr -d '[:space:]')
          floor=${ends%%,*}
          ceiling=${ends##*,}

          extras=$(echo "$MOODLE_EXTRA_VERSIONS" | jq -r '.[]' | tr -d '\r')
          for extra in $extras; do
            if [ "$extra" -le "$floor" ] || [ "$extra" -ge "$ceiling" ]; then
              echo "::error::Moodle $extra is in MOODLE_EXTRA_VERSIONS but not between the ends of \$plugin->supported ($floor to $ceiling)."
              exit 1
            fi
          done

          entries='[]'
          for version in $(printf '%s\n' "$floor" "$ceiling" $extras | sort -n -u); do
            phps=$(echo "$MOODLE_PHP_TABLE" | jq -r --arg v "$version" '.[$v] // empty | .[]' | tr -d '\r')
            if [ -z "$phps" ]; then
              echo "::error::No PHP versions are listed in MOODLE_PHP_TABLE for Moodle $version."
              exit 1
            fi
            dbs=$(echo "$MOODLE_DB_TABLE" | jq -c --arg v "$version" '.[$v] // empty')
            if [ -z "$dbs" ]; then
              echo "::error::No database versions are listed in MOODLE_DB_TABLE for Moodle $version."
              exit 1
            fi

            while IFS= read -r php; do
              for database in mariadb pgsql; do
                entries=$(jq -c \
                  --arg php "$php" \
                  --arg branch "MOODLE_${version}_STABLE" \
                  --arg database "$database" \
                  --argjson dbs "$dbs" \
                  '. + [{"php": $php, "moodle-branch": $branch, "database": $database,
                         "postgres-version": $dbs.postgres, "mariadb-version": $dbs.mariadb}]' <<< "$entries")
              done
            done <<< "$phps"
          done

          matrix=$(jq -cn --argjson entries "$entries" '{include: $entries}')
          echo "Generated test matrix:"
          echo "$matrix" | jq .
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: Moodle ${{ matrix.moodle-branch }} - PHP ${{ matrix.php }} - ${{ matrix.database }}
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping" --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        shell: bash
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          PHPMD_IGNORE_PATHS: tests

      - name: PHP lint
        run: moodle-plugin-ci phplint

      - name: Moodle code checker
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc checker
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints

      - name: Lint Mustache templates
        run: moodle-plugin-ci mustache

      - name: Build AMD modules
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Run PHPUnit tests
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Run Behat tests
        id: behat
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat failure output
        if: failure() && steps.behat.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: behat-faildump-${{ matrix.moodle-branch }}-${{ matrix.php }}-${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          if-no-files-found: ignore
          retention-days: 7

  complete:
    name: CI complete
    if: always()
    needs:
      - setup
      - test
    runs-on: ubuntu-22.04
    steps:
      - name: Check required jobs
        env:
          SETUP: ${{ needs.setup.result }}
          TEST: ${{ needs.test.result }}
        run: |
          test "$SETUP" = success
          test "$TEST" = success
